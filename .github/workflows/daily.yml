name: Nepal news radar

on:
  schedule:
    - cron: "30 0 * * *"    # 06:15 Nepal time: the morning list and digest
    - cron: "15 7 * * *"    # 13:00 Nepal time: refresh the list and the archive
    - cron: "15 13 * * *"   # 19:00 Nepal time: evening refresh
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nepalradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Collect, archive, cluster and score
        id: radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m nepalradar run
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/onthisday.json docs/archive data/seen.json data/first_seen.json data/onthisday digests/latest.md
          [ -f data/gdelt_last.json ] && git add data/gdelt_last.json
          [ -f data/llm_cache.json ] && git add data/llm_cache.json
          git diff --cached --quiet || git commit -m "Radar: ${{ steps.radar.outputs.shown }} stories, ${{ steps.radar.outputs.new_today }} new"
          git pull --rebase --autostash && git push
      - name: Send digest (opens an issue, which GitHub emails to you)
        # Once a day: later runs send it only if the morning run did not.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Nepal news radar $(TZ=Asia/Kathmandu date +%F)"
          SENT=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$SENT" = "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh issue create \
              --title "$TITLE: ${{ steps.radar.outputs.new_today }} new, ${{ steps.radar.outputs.shown }} stories" \
              --body-file digests/latest.md
          fi
