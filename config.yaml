# --------------------------------------------------------------------------- historic archive
archive:
  # The daily run adds what it collects to docs/archive/. For earlier days run
  #   python -m nepalradar archive backfill --from 2025-01-01 --to 2025-01-31
  # which reads GDELT (world press, since 2017) and these WordPress sites' own archives (complete, any date).
  wordpress:
    - {name: Onlinekhabar, base: "https://www.onlinekhabar.com", weight: 1.0, region: Nepal, lang: ne}
    - {name: Onlinekhabar English, base: "https://english.onlinekhabar.com", weight: 0.9, region: Nepal, lang: en}
    - {name: Khabarhub, base: "https://khabarhub.com", weight: 0.8, region: Nepal, lang: ne}
    - {name: Khabarhub English, base: "https://english.khabarhub.com", weight: 0.75, region: Nepal, lang: en}
    - {name: News of Nepal, base: "https://newsofnepal.com", weight: 0.55, region: Nepal, lang: ne}         # since 2015
    - {name: Imagekhabar, base: "https://www.imagekhabar.com", weight: 0.6, region: Nepal, lang: ne}        # since 2016
    - {name: Clickmandu, base: "https://clickmandu.com", weight: 0.5, region: Nepal, lang: ne}              # since 2016
    - {name: Nepal News English, base: "https://english.nepalnews.com", weight: 0.7, region: Nepal, lang: en}  # since Nov 2020
    - {name: Nepal News, base: "https://nepalnews.com", weight: 0.65, region: Nepal, lang: ne}             # since May 2025

# Daily round-ups of the news by Nepali outlets, linked at the top of the dashboard and the digest.
briefings:
  - {name: Nepal News Evening Briefing, base: "https://english.nepalnews.com", search: "Nepal News Evening Briefing"}
  # Onlinekhabar English's "Daily Digest" works the same way, but its last edition was on 1 October 2026:
  # - {name: Onlinekhabar Daily Digest, base: "https://english.onlinekhabar.com", search: "Daily digest"}

# --------------------------------------------------------------------------- on this day in history
onthisday:
  # Each run adds "On this day in Nepal": for today's date, the best-known Nepal incident of every past year
  # (from Wikipedia, ranked by how many language editions cover it) and a news piece from that day (the
  # article's own dated citations, or the Nepali sites' archives from 2013 on). Cached in data/onthisday/.
  enabled: true
  from_year: 1920
  refresh_days: 60        # recompute a date's page after this many days
  workers: 4              # parallel requests to Wikipedia
  max_checks: 5           # Wikipedia search hits read per year
  search_archives: true   # look for the news piece in the Nepali sites' archives (2013 on)
  top_stories: true       # years with nothing on Wikipedia: the day's most covered story in the archives
  top_story_from: 2014
  current_events_from: 2002   # Wikipedia's daily news pages ("Portal:Current events/2015 September 20")
  # nepalnews.com's daily news pages of 2001-2004, as saved by the Internet Archive's Wayback Machine
  nepalnews_wayback: {from: 2001, to: 2004}
  nepali_times: true          # the Nepali Times issue of that week (archive.nepalitimes.com, since July 2000)
  kantipur_archive: true      # Kantipur's own daily reprint of a story from about 26 years ago
