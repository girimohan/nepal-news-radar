  - name: Society, law & health
    weight: 0.75
    any: [police, arrested, arrest, murder, court verdict, fraud, scam, smuggling, trafficking, accident,
          bus accident, road accident, hospital, health, dengue, outbreak, education, school, university, exam,
          women, dalit, citizenship, प्रहरी, पक्राउ, हत्या, ठगी, तस्करी, दुर्घटना, बस दुर्घटना, अस्पताल, स्वास्थ्य,
          डेंगी, महामारी, शिक्षा, विद्यालय, विश्वविद्यालय, परीक्षा, महिला, दलित, नागरिकता]
  - name: Sports & culture
    weight: 0.6
    any: [cricket, football, npl, world cup, asian games, olympics, film, movie, music, festival, dashain, tihar,
          chhath, basketball, volleyball, national games, क्रिकेट, फुटबल, बास्केटबल, भलिबल, एनपीएल, विश्वकप,
          खेलकुद, राष्ट्रिय खेलकुद, गोल, कप्तान, प्रतियोगिता, चलचित्र, फिल्म, सङ्गीत, चाड, दसैं, दशैं, तिहार, छठ]
  - name: Tech & startups
    weight: 0.6
    any: [startup, technology, internet, digital, ai, artificial intelligence, social media, tiktok, facebook,
          cyber, online fraud, e-sewa, fintech, telecom, ntc, ncell, स्टार्टअप, प्रविधि, इन्टरनेट, डिजिटल,
          सामाजिक सञ्जाल, टिकटक, साइबर, अनलाइन ठगी, दूरसञ्चार, एनसेल]

# A story that matches no topic is dropped, unless at least this many outlets cover it (big breaking news).
untopical_min_outlets: 4

# Headline words that drop a story.
exclude_title: [horoscope, rashifal, राशिफल, आजको राशिफल, gold price today, सुनको मूल्य, crossword, sponsored,
                "podcast:", "quiz:", "photos:", "(photos)", "(तस्बिर)", "(तस्बिरहरू)", "(भिडियो)", "video:",
                # round-ups of the day's news (shown on their own, see briefings), not stories
                "evening briefing", "daily digest"]

# Links containing any of these are world news a Nepali portal ran (not about Nepal), and are left out.
exclude_url: [/world/, /international/, /global/, /antarrastriya/, /world-news/]

scoring:
  # Each signal is turned into 0-1, and they combine as 1 - (1 - w1*s1)(1 - w2*s2)(1 - w3*s3).
  coverage: 0.85       # how many distinct outlets ran the story, weighted by outlet weight
  engagement: 0.5      # Reddit upvotes and comments (r/Nepal), when Reddit is set up
  velocity: 0.25       # engagement per hour since the story first appeared
  coverage_saturation: 8       # this many weighted outlets counts as full coverage
  engagement_saturation: 1500  # this much engagement (points + 2 x comments) counts as full engagement
  recency_weight: 0.6
  half_life_hours: 18
  rising_bonus: 8              # extra points when more outlets picked the story up since yesterday

# One outlet scores about 20; two outlets about 30; three about 40.
min_score: 25
max_stories: 100           # how many go to the dashboard

clustering:
  threshold: 0.18
  min_shared_terms: 1
  dek_weight: 0.5
  nameless_penalty: 0.1

llm:
  enabled: true            # only used when ANTHROPIC_API_KEY is set
  model: claude-haiku-5-5
  top_n: 30                # how many of the best stories get a brief each run
  workers: 4
  audience: >-
    An editor who follows news about Nepal and Nepali people at home and abroad, writing in English for readers
    who may not read Nepali.

# --------------------------------------------------------------------------- sources
sources:
  feeds:
    enabled: true
  gdelt:
    # The world's press writing about Nepal (Indian, Bangladeshi, Malaysian, Gulf, Western outlets...).
    enabled: true
    queries: ["nepal"]            # one light query: GDELT also matches translated text, and heavy queries time out
    languages: [english, nepali]   # GDELT language names; titles in other languages are hard to cluster
    weight: 0.6
    # Already read through their own feeds; GDELT copies would count the same article twice.
    skip_domains: []
  reddit:
    # Needs a free Reddit "script" app: set REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET as repository secrets.
    enabled: true
    subreddits: [Nepal, NepalSocial, Kathmandu]
    min_score: 40
  hackernews:
    enabled: false
    min_points: 40

