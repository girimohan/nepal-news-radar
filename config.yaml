# Everything you are likely to tune lives in this file.
# Edit, commit, and the next run picks it up.

# How far back to look. Stories older than this are ignored.
lookback_hours: 48

# Topics are checked against each story's headlines and snippets, in English and Nepali; every topic whose
# keywords appear counts, and the best weight wins. "weight" (0-1) says how much you care about that topic.
# Nepali keywords also match with a joined postposition: "भूकम्प" finds "भूकम्पको" and "भूकम्पमा".
topics:
  - name: Politics & government
    weight: 1.0
    any: [prime minister, parliament, house of representatives, national assembly, cabinet, minister, election,
          by-election, constitution, supreme court, nepali congress, uml, maoist, rsp, rastriya swatantra, rpp,
          janamat, balen, balendra shah, oli, prachanda, deuba, coalition, no-confidence, ordinance, ciaa,
          corruption, provincial government, chief minister, gen z, protest, प्रधानमन्त्री, संसद, प्रतिनिधिसभा,
          राष्ट्रियसभा, मन्त्रिपरिषद्, मन्त्री, निर्वाचन, चुनाव, संविधान, सर्वोच्च, कांग्रेस, एमाले, माओवादी, रास्वपा,
          राप्रपा, गठबन्धन, सरकार, अख्तियार, भ्रष्टाचार, मुख्यमन्त्री, प्रदेश सरकार, आन्दोलन, प्रदर्शन, अध्यादेश]
  - name: Disasters & climate
    weight: 1.0
    any: [earthquake, flood, floods, landslide, glof, glacial lake, avalanche, wildfire, cold wave, monsoon,
          rescue, death toll, missing, disaster, climate, drought, lightning, भूकम्प, बाढी, पहिरो, हिमताल, हिमपहिरो,
          डढेलो, शीतलहर, मनसुन, उद्धार, विपद्, मृत्यु, बेपत्ता, जलवायु, खडेरी, चट्याङ]
  - name: Nepalis abroad & migration
    weight: 0.95
    any: [nepali workers, nepali worker, migrant workers, migrant worker, foreign employment, remittance,
          remittances, nrn, nrna, nepali diaspora, nepalis in, nepali students, labour permit, manpower,
          gulf, qatar, saudi, uae, malaysia, korea eps, japan, israel, russian army, वैदेशिक रोजगार, रेमिट्यान्स,
          विप्रेषण, श्रमिक, श्रम स्वीकृति, म्यानपावर, गैरआवासीय, एनआरएन, खाडी, कतार, साउदी, मलेसिया, कोरिया,
          जापान, रुसी सेना, डायस्पोरा]
  - name: Foreign relations
    weight: 0.9
    any: [india, china, united states, us embassy, bangladesh, bhutan, pakistan, bri, mcc, border, lipulekh,
          kalapani, bilateral, foreign minister, foreign secretary, ambassador, diplomat, saarc, bimstec, un,
          भारत, चीन, अमेरिका, बंगलादेश, भुटान, सीमा, लिपुलेक, कालापानी, द्विपक्षीय, परराष्ट्र, राजदूत, कूटनीति]
  - name: Economy & business
    weight: 0.85
    any: [economy, budget, inflation, nepal rastra bank, nrb, monetary policy, interest rate, nepse, stock market,
          share market, trade deficit, imports, exports, hydropower, electricity, investment, fdi, tax, revenue,
          gdp, bank, banks, loan, fuel price, petroleum, nepal oil, cooperative, अर्थतन्त्र, बजेट, महँगी,
          राष्ट्र बैंक, मौद्रिक नीति, ब्याजदर, नेप्से, सेयर, व्यापार घाटा, आयात, निर्यात, जलविद्युत्, बिजुली,
          लगानी, कर, राजस्व, बैंक, ऋण, इन्धन, पेट्रोलियम, आयल निगम, सहकारी]
  - name: Tourism & mountains
    weight: 0.8
    any: [tourism, tourist, tourists, everest, sagarmatha, mountaineering, climber, climbers, expedition, trekking,
          himalaya, himalayan, summit, lumbini, pokhara, airline, airlines, flight, airport, plane crash,
