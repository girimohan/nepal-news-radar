<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nepal News Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0EA; --panel:#FBFAF7; --ink:#1D1A16; --muted:#665F55; --line:#D9D2C6;
  --hot:#C2410C; --hot-soft:#FBE4D6; --blue:#1D4E89; --blue-soft:#DCE7F5; --green:#2F6B3A; --green-soft:#DDEEDD;
  --display:"Bricolage Grotesque","Noto Sans Devanagari","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#16130F; --panel:#1F1B16; --ink:#EEE8DF; --muted:#A9A094; --line:#3A332B;
  --hot:#FB8F5B; --hot-soft:#43261A; --blue:#8DB6EE; --blue-soft:#1C2B40; --green:#8FD19B; --green-soft:#1D3322;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
a{color:var(--blue)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{padding:28px 0 4px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
h1{font:700 clamp(28px,4.4vw,44px)/1.05 var(--display);letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hot)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:22px 0 60px}
@media (max-width:820px){.layout{grid-template-columns:1fr;gap:14px}}
aside h2{font:700 15px/1.2 var(--display);margin:18px 0 8px}
aside h2:first-child{margin-top:0}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:5px 8px;cursor:pointer}
.pick:hover{background:var(--line)}
.pick[aria-pressed=true]{background:var(--hot-soft);font-weight:600}
.pick span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:820px){aside{display:flex;flex-wrap:wrap;gap:6px}aside h2{display:none}
  .pick{width:auto;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13.5px}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.bar select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.count{color:var(--muted);font-size:13.5px}
.story{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:54px 1fr;gap:14px}
.score{text-align:center}
.score b{display:block;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hot)}
.score small{color:var(--muted);font-size:11.5px}
.story h3{font:600 18px/1.3 var(--display);margin:0 0 6px}
.story h3 a{color:var(--ink);text-decoration:none}
.story h3 a:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.tag.new{background:var(--blue-soft);color:var(--blue);font-weight:600}
.tag.rising{background:var(--hot-soft);color:var(--hot);font-weight:600}
.tag.fi{background:var(--green-soft);color:var(--green);font-weight:600}
.brief p{margin:4px 0}
.brief .lbl{font-weight:600}
.low{color:var(--hot);font-size:13px}
.why{color:var(--muted);font-size:13.5px;margin:8px 0 0}
details.src{margin-top:8px}
details.src summary{cursor:pointer;color:var(--blue);font-size:14px}
details.src ul{margin:6px 0 0;padding-left:18px;font-size:14px}
details.src li{margin:3px 0}
details.src .t{color:var(--muted);font-size:12.5px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13.5px}
.btn[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#fff}
.empty{color:var(--muted);padding:30px 0}
table.health{border-collapse:collapse;width:100%;font-size:14px}
table.health td,table.health th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.ok{color:var(--green);font-weight:600}.err{color:var(--hot);font-weight:600}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
.tag.ne{background:var(--blue-soft);color:var(--blue)}
.arch-form{display:grid;grid-template-columns:2fr repeat(4,auto) auto;gap:10px;align-items:end;margin-bottom:14px}
@media (max-width:820px){.arch-form{grid-template-columns:1fr 1fr}}
.arch-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.arch-form input,.arch-form select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.go{background:var(--hot);border:0;color:#fff;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}
.days{display:flex;align-items:flex-end;gap:2px;height:56px;margin:10px 0 4px}
.days i{flex:1;background:var(--hot);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.days-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}
.hit{border-bottom:1px solid var(--line);padding:10px 2px}
.hit a{font-weight:600;color:var(--ink);text-decoration:none}.hit a:hover{text-decoration:underline}
.hit .meta{color:var(--muted);font-size:13px;margin-top:2px}.hit p{margin:4px 0 0;font-size:14px}
.facets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.facets button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px}
.facets button[aria-pressed=true]{background:var(--hot-soft);border-color:var(--hot)}
.otd-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.otd-head h2{font:700 26px/1.15 var(--display);margin:0}
.feature{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hot);border-radius:10px;padding:18px 20px;margin:14px 0 22px}
.feature .yr{font:700 44px/1 var(--display);color:var(--hot);font-variant-numeric:tabular-nums}
.feature p{font-size:17px;margin:8px 0}
.timeline{border-left:2px solid var(--line);margin-left:30px;padding-left:0}
.yrow{position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;padding:10px 0 14px 18px}
.yrow::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--hot)}
.yrow .y{font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-left:-82px;text-align:right;width:56px}
@media (max-width:820px){.timeline{margin-left:8px}.yrow{grid-template-columns:1fr;gap:2px}.yrow .y{margin-left:0;text-align:left}}
.yrow p{margin:2px 0}
.news{font-size:14px;margin-top:6px;padding:8px 10px;background:var(--paper);border-radius:6px;border:1px solid var(--line)}
.news b{font-weight:600}
.src-line{color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Nepal News Radar</h1>
      <p class="sub" id="sub">The Nepal stories that the most outlets are covering, in Nepali and English, and an archive of past news.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" aria-selected="false" data-tab="history">On this day</button>
    <button role="tab" aria-selected="false" data-tab="archive">Archive</button>
    <button role="tab" aria-selected="false" data-tab="saved">Saved <span id="savedN"></span></button>
    <button role="tab" aria-selected="false" data-tab="sources">Sources</button>
  </nav>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "nepal-news-radar:saved";
const SCOPE = {national: "National", local: "Local", diaspora: "Nepalis abroad", international: "International"};
const ABROAD = s => (s.brief||{}).scope === "diaspora" || s.topic === "Nepalis abroad & migration";
const INTL = s => (s.regions||[]).some(r => r !== "Nepal" && r !== "Social");
const NE_ONLY = s => (s.langs||[]).length === 1 && s.langs[0] === "ne";
let DATA = null, tab = "today", topic = "", status = "", q = "", sort = "score";
function loadSaved(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
function storeSaved(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
let SAVED = loadSaved();

function ago(iso){
  if(!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? "under an hour ago" : h < 48 ? `${Math.round(h)}h ago` : `${Math.round(h/24)} days ago`;
}
function headline(s){ return (s.brief && s.brief.headline) || s.headline; }

function card(s, i){
  const b = s.brief || {};
  const tags = [
    s.status === "new" ? `<span class="tag new">New today</span>` : "",
    s.status === "rising" ? `<span class="tag rising">Rising</span>` : "",
    b.scope ? `<span class="tag fi">${esc(SCOPE[b.scope] || b.scope)}</span>` : "",
    NE_ONLY(s) ? `<span class="tag ne" title="Only Nepali-language outlets have this story so far">नेपाली press only</span>` : "",
    INTL(s) ? `<span class="tag ne">International press</span>` : "",
    `<span class="tag">${esc(s.topic)}</span>`,
    `<span class="tag">${s.outlet_count} outlet${s.outlet_count === 1 ? "" : "s"}</span>`,
    s.engagement ? `<span class="tag">${s.engagement.toLocaleString()} social</span>` : "",
  ].join("");
  const brief = b.summary ? `<div class="brief">
      <p>${esc(b.summary)}</p>
      <p><span class="lbl">Why it matters:</span> ${esc(b.why_it_matters)}</p>
      <p><span class="lbl">Angle:</span> ${esc(b.angle)}</p>
      ${b.confidence === "low" ? `<p class="low">Low confidence: rests on one outlet or a social post.</p>` : ""}
    </div>` : "";
  const src = s.articles.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.outlet)}: ${esc(a.title)}</a>
      ${a.discussion_url ? ` · <a href="${esc(a.discussion_url)}" target="_blank" rel="noopener">discussion</a> <span class="t">${a.points} points, ${a.comments} comments</span>` : ""}
      <span class="t">${esc(ago(a.published))}</span></li>`).join("");
  const saved = !!SAVED[s.id];
  return `<article class="story">
    <div class="score"><b>${Math.round(s.score)}</b><div class="meter"><i style="width:${Math.min(100, s.score)}%"></i></div><small>${i != null ? "#" + (i + 1) : ""}</small></div>
    <div>
      <h3><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(headline(s))}</a></h3>
      <div class="tags">${tags}</div>
      ${brief}
      <p class="why">${esc(s.reasons.join(" · "))}</p>
      <details class="src"><summary>${s.articles.length} article${s.articles.length === 1 ? "" : "s"} and posts</summary><ul>${src}</ul></details>
      <div class="acts">
        <button class="btn" data-save="${esc(s.id)}" aria-pressed="${saved}">${saved ? "Saved" : "Save"}</button>
      </div>
    </div>
  </article>`;
}

function filtered(){
  let xs = DATA.stories.filter(s =>
    (!topic || s.topic === topic || (s.topics || []).includes(topic)) &&
    (!status || (status === "abroad" ? ABROAD(s) : status === "intl" ? INTL(s) : status === "ne" ? NE_ONLY(s) : s.status === status)) &&
    (!q || (headline(s) + " " + s.headline + " " + s.outlets.join(" ") + " " + ((s.brief||{}).summary || "")).toLowerCase().includes(q)));
  if (sort === "newest") xs = xs.slice().sort((a, b) => (b.first_published || "").localeCompare(a.first_published || ""));
  if (sort === "outlets") xs = xs.slice().sort((a, b) => b.outlet_count - a.outlet_count || b.score - a.score);
  if (sort === "social") xs = xs.slice().sort((a, b) => b.engagement - a.engagement || b.score - a.score);
  return xs;
}

function pick(attr, value, label, n, current){
  return `<button class="pick" data-${attr}="${esc(value)}" aria-pressed="${current === value}"><span>${esc(label)}</span><span>${n}</span></button>`;
}

function renderToday(){
  const st = DATA.stories;
  const topics = DATA.topics.filter(t => st.some(s => s.topic === t || (s.topics||[]).includes(t)));
  const cnt = t => st.filter(s => s.topic === t || (s.topics||[]).includes(t)).length;
  const xs = filtered();
  $("#view").innerHTML = `<div class="layout">
    <aside>
      <h2>Topic</h2>${pick("topic", "", "All topics", st.length, topic)}${topics.map(t => pick("topic", t, t, cnt(t), topic)).join("")}
      <h2>Show</h2>${pick("status", "", "Everything", st.length, status)}
        ${pick("status", "new", "New today", st.filter(s => s.status === "new").length, status)}
        ${pick("status", "rising", "Rising", st.filter(s => s.status === "rising").length, status)}
        ${pick("status", "abroad", "Nepalis abroad", st.filter(ABROAD).length, status)}
        ${pick("status", "intl", "In the international press", st.filter(INTL).length, status)}
        ${pick("status", "ne", "Nepali press only", st.filter(NE_ONLY).length, status)}
    </aside>
    <main>
      <div class="bar">
        <input type="search" id="q" placeholder="Search headlines, outlets, briefs" value="${esc(q)}" aria-label="Search">
        <select id="sort" aria-label="Sort">
          <option value="score">Most viral</option><option value="newest">Newest</option>
          <option value="outlets">Most outlets</option><option value="social">Most Reddit buzz</option>
        </select>
        <span class="count">${xs.length} of ${st.length}</span>
      </div>
      ${(DATA.briefings || []).length ? `<div class="src-line" style="margin:4px 0 10px">Daily round-ups: ${DATA.briefings.map(b =>
        `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a>`).join(" · ")}</div>` : ""}
      ${xs.length ? xs.map((s, i) => card(s, sort === "score" ? i : null)).join("") : `<p class="empty">Nothing matches.</p>`}
    </main></div>`;
  $("#sort").value = sort;
  $("#q").addEventListener("input", e => { q = e.target.value.toLowerCase(); const p = e.target.selectionStart; renderToday(); const el = $("#q"); el.focus(); el.setSelectionRange(p, p); });
  $("#sort").addEventListener("change", e => { sort = e.target.value; renderToday(); });
}

function savedMarkdown(){
  return Object.values(SAVED).sort((a, b) => b.score - a.score).map(s => {
    const b = s.brief || {};
    return `### ${headline(s)}\n${b.summary ? b.summary + "\n" : ""}${b.angle ? "*Angle:* " + b.angle + "\n" : ""}Sources: ${s.articles.slice(0, 6).map(a => `[${a.outlet}](${a.url})`).join(", ")}\n`;
  }).join("\n");
}

function renderSaved(){
  const xs = Object.values(SAVED).sort((a, b) => b.score - a.score);
  $("#view").innerHTML = `<div style="padding:22px 0 60px">
    <div class="bar"><span class="count">${xs.length} saved. Kept in this browser only.</span>
      ${xs.length ? `<button class="btn" id="copy">Copy as Markdown</button><button class="btn" id="clear">Clear all</button>` : ""}</div>
    ${xs.length ? xs.map(s => card(s, null)).join("") : `<p class="empty">Save stories from the Today tab to collect them here.</p>`}
  </div>`;
  const c = $("#copy"); if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(savedMarkdown()); c.textContent = "Copied"; } catch(e){ c.textContent = "Copy failed"; } };
  const k = $("#clear"); if (k) k.onclick = () => { SAVED = {}; storeSaved(SAVED); render(); };
}

function renderSources(){
  const f = DATA.funnel, u = DATA.llm || {};
  $("#view").innerHTML = `<div style="padding:22px 0 60px">
    <p>${f.collected.toLocaleString()} articles and posts collected → ${f.articles_in_window.toLocaleString()} from the last ${DATA.lookback_hours} hours
      → ${f.stories.toLocaleString()} stories → ${f.off_topic.toLocaleString()} off your topics, ${f.low_score.toLocaleString()} below the score cut → <b>${f.shown} shown</b>.</p>
    <table class="health"><tr><th>Source</th><th>Status</th><th>Fetched</th><th>In shown stories</th><th>Detail</th></tr>
    ${DATA.sources.map(s => `<tr><td>${esc(s.name)}</td><td class="${s.ok ? "ok" : "err"}">${s.ok ? "OK" : "Failed"}</td><td>${s.fetched}</td><td>${s.in_stories}</td><td>${esc(s.error || s.detail)}</td></tr>`).join("")}
    </table>
    <p>${u.enabled ? `Briefs by ${esc(u.model)} from headlines and snippets only, each checked against a verbatim quote: ${u.calls} written today, ${u.cached} reused, ${u.unverified} discarded because the quote was not found. Cost today $${(u.cost_usd || 0).toFixed(4)}.`
      : "Briefs are off. Add an ANTHROPIC_API_KEY repository secret to turn them on."}</p>
  </div>`;
}

// ------------------------------------------------------------------ archive
const DEVA = "ऀ-ॣ०-ॿ";
const NE_SUF = ["हरूलाई","हरुलाई","हरूको","हरुको","हरूले","हरुले","हरूमा","हरुमा","हरू","हरु","द्वारा","देखि","सम्म","लाई","बाट","सँग","माथि","भित्र","को","का","की","ले","मा"];
let ARCH = {idx: null, rows: null, words: "", from: "", to: "", lang: "", match: "any", outlet: "", busy: false, note: ""};
function wordRe(w){
  // Same rule as the Python side: whole words; a Nepali word may carry a joined postposition (भूकम्प -> भूकम्पमा).
  const body = w.trim().toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "[\\s\\-/]+");
  const wc = `a-z0-9${DEVA}`;
  return new RegExp(new RegExp(`[${DEVA}]`).test(w)
    ? `(?<![${wc}])${body}(?:${NE_SUF.join("|")})?(?![${wc}])`
    : `(?<![${wc}])${body}(?![${wc}])`);
}
function splitWords(q){ return (q.match(/"[^"]+"|\S+/g) || []).map(x => x.replace(/"/g, "")).filter(Boolean); }
function isoDay(d){ return d.toISOString().slice(0, 10); }
function daysBetween(a, b){
  const out = [];
  if (!a || !b) return out;
  for (let d = new Date(a + "T00:00:00Z"); isoDay(d) <= b && out.length < 4000; d.setUTCDate(d.getUTCDate() + 1)) out.push(isoDay(d));
  return out;
}
async function loadArchiveIndex(){
  if (ARCH.idx) return ARCH.idx;
  try { ARCH.idx = await (await fetch("archive/index.json", {cache: "no-store"})).json(); } catch(e){ ARCH.idx = {days: {}, total: 0}; }
  ARCH.idx.days = ARCH.idx.days || {};
  if (!ARCH.to) {
    ARCH.to = ARCH.idx.last || isoDay(new Date());
    const f = new Date(ARCH.to + "T00:00:00Z"); f.setUTCDate(f.getUTCDate() - 6); ARCH.from = isoDay(f);
  }
  return ARCH.idx;
}
async function runArchive(){
  const span = daysBetween(ARCH.from, ARCH.to);
  if (span.length > 370) { ARCH.note = "Pick a range of a year or less."; renderArchive(); return; }
  const days = span.filter(d => ARCH.idx.days[d]);
  ARCH.busy = true; ARCH.note = ""; renderArchive();
  const res = [];
  const ws = splitWords(ARCH.words).map(wordRe);
  for (let i = 0; i < days.length; i += 12) {
    const chunk = await Promise.all(days.slice(i, i + 12).map(d => {
      const [y, m, dd] = d.split("-");
      return fetch(`archive/${y}/${m}/${dd}.jsonl`).then(r => r.ok ? r.text() : "").catch(() => "");
    }));
    for (const txt of chunk) for (const line of txt.split("\n")) {
      if (!line.trim()) continue;
      let r; try { r = JSON.parse(line); } catch(e){ continue; }
      if (ARCH.lang && r.lang !== ARCH.lang) continue;
      if (ws.length) {
        const t = (r.title + " " + (r.summary || "")).toLowerCase();
        const hits = ws.map(re => re.test(t));
        if (!(ARCH.match === "all" ? hits.every(Boolean) : hits.some(Boolean))) continue;
      }
      res.push(r);
    }
  }
  res.sort((a, b) => b.published.localeCompare(a.published));
  ARCH.rows = res; ARCH.outlet = ""; ARCH.busy = false; renderArchive();
}
function archiveCsv(rows){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return "﻿date,outlet,language,title,url,snippet\n"
    + rows.map(r => [r.published, r.outlet, r.lang, r.title, r.url, r.summary].map(q).join(",")).join("\n");
}
async function renderArchive(){
  const idx = await loadArchiveIndex();
  if (tab !== "archive") return;
  const all = ARCH.rows || [];
  const rows = ARCH.outlet ? all.filter(r => r.outlet === ARCH.outlet) : all;
  const outlets = Object.entries(all.reduce((m, r) => (m[r.outlet] = (m[r.outlet] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  const perDay = daysBetween(ARCH.from, ARCH.to).map(d => [d, rows.filter(r => r.published.slice(0, 10) === d).length]);
  const max = Math.max(1, ...perDay.map(x => x[1]));
  $("#view").innerHTML = `<div style="padding:22px 0 60px">
    <p class="count">${(idx.total || 0).toLocaleString()} articles stored, ${esc(idx.first || "–")} to ${esc(idx.last || "–")}.
      Each run adds that day's news; earlier days are added with <code>python -m nepalradar archive backfill</code>
      or the <i>Back-fill archive</i> workflow.</p>
    <form class="arch-form" id="af">
      <label>Words, English or Nepali ("quotes" for a phrase)<input type="search" id="aw" value="${esc(ARCH.words)}" placeholder="earthquake भूकम्प"></label>
      <label>From<input type="date" id="afrom" value="${esc(ARCH.from)}"></label>
      <label>To<input type="date" id="ato" value="${esc(ARCH.to)}"></label>
      <label>Language<select id="alang"><option value="">Any</option><option value="ne">Nepali</option><option value="en">English</option></select></label>
      <label>Match<select id="amatch"><option value="any">any word</option><option value="all">every word</option></select></label>
      <button class="go" type="submit"${ARCH.busy ? " disabled" : ""}>${ARCH.busy ? "Searching…" : "Search"}</button>
    </form>
    ${ARCH.note ? `<p class="low">${esc(ARCH.note)}</p>` : ""}
    ${ARCH.rows ? `
      <div class="bar"><span class="count">${rows.length.toLocaleString()} article${rows.length === 1 ? "" : "s"}${ARCH.outlet ? " from " + esc(ARCH.outlet) : ""}</span>
        ${rows.length ? `<button class="btn" id="csv">Download CSV</button>` : ""}</div>
      ${perDay.length > 1 ? `<div class="days" aria-label="Articles per day">${perDay.map(([d, n]) => `<i style="height:${Math.round(100 * n / max)}%" title="${d}: ${n}"></i>`).join("")}</div>
        <div class="days-axis"><span>${esc(ARCH.from)}</span><span>${esc(ARCH.to)}</span></div>` : ""}
      ${outlets.length > 1 ? `<div class="facets">${outlets.slice(0, 24).map(([o, n]) => `<button data-outlet="${esc(o)}" aria-pressed="${ARCH.outlet === o}">${esc(o)} ${n}</button>`).join("")}</div>` : ""}
      ${rows.slice(0, 500).map(r => `<div class="hit"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
        <div class="meta">${esc(r.published.slice(0, 16).replace("T", " "))} UTC · ${esc(r.outlet)}${r.lang ? " · " + esc(r.lang) : ""}</div>
        ${r.summary ? `<p>${esc(r.summary)}</p>` : ""}</div>`).join("")}
      ${rows.length > 500 ? `<p class="count">Showing the newest 500. Download the CSV for all of them.</p>` : ""}
      ${!rows.length ? `<p class="empty">Nothing in the archive matches. Try other words, a wider range, or back-fill those days.</p>` : ""}` : ""}
  </div>`;
  $("#alang").value = ARCH.lang; $("#amatch").value = ARCH.match;
  $("#af").onsubmit = e => {
    e.preventDefault();
    ARCH.words = $("#aw").value; ARCH.from = $("#afrom").value; ARCH.to = $("#ato").value;
    ARCH.lang = $("#alang").value; ARCH.match = $("#amatch").value;
    if (ARCH.from > ARCH.to) [ARCH.from, ARCH.to] = [ARCH.to, ARCH.from];
    runArchive();
  };
  const c = $("#csv");
  if (c) c.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([archiveCsv(rows)], {type: "text/csv;charset=utf-8"}));
    a.download = `nepal-news-${ARCH.from}-${ARCH.to}.csv`; a.click();
  };
}

// ------------------------------------------------------------------ on this day
let OTD = null;
const KIND = {birth: "Born", death: "Died", top_story: "Most covered story that day",
  day_news: "nepalnews.com's lead story that day", weekly: "Nepali Times headline that week"};
const HOW = {cited: "cited by Wikipedia", current_events: "cited on Wikipedia's daily news page",
  archive: "from the Nepali sites' archives", wayback: "saved by the Wayback Machine", nepalitimes: "Nepali Times archive"};
function newsLine(n){
  if (!n) return "";
  const how = HOW[n.kind] || "";
  const label = n.kind === "nepalitimes" ? "News that week" : "News that day";
  return `<div class="news"><b>${label}:</b> <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <span class="t"> · ${esc(n.outlet)}, ${esc(n.date)}${how ? " · " + how : ""}</span></div>`;
}
function kantipurBox(k){
  if (!k) return "";
  const title = k.title_en || k.title, summary = k.summary_en || k.summary;
  const when = k.year ? `${k.year}, about ${k.years_ago} years ago` : "";
  return `<div class="feature" style="border-left-color:var(--ink,#333)"><div class="tags"><span class="tag ne">Kantipur's archive pick today</span>${when ? `<span class="tag">${esc(when)}</span>` : ""}</div>
    <p><a href="${esc(k.url_en || k.url)}" target="_blank" rel="noopener"><b>${esc(title.replace(/^\[(Archive|अर्काइभ)\]\s*(\.\.\.)?/, ""))}</b></a></p>
    ${summary ? `<p class="t">${esc(summary)}</p>` : ""}
    <div class="src-line">Kantipur reprints one of its own stories from about 26 years ago each day${k.url_en ? ` · <a href="${esc(k.url)}" target="_blank" rel="noopener">नेपालीमा</a>` : ""}</div></div>`;
}
function otdItem(c){
  const tags = [c.kind !== "event" ? `<span class="tag ${c.kind === "top_story" ? "ne" : ""}">${esc(KIND[c.kind] || c.kind)}</span>` : "",
    c.kind === "top_story" ? `<span class="tag">${c.links} outlets</span>`
      : c.links ? `<span class="tag" title="Wikipedia language editions with an article on it">${c.links} Wikipedia languages</span>` : ""].join("");
  const wiki = c.kind !== "top_story" && c.url ? `<div class="src-line">From <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> on Wikipedia</div>` : "";
  return `${tags ? `<div class="tags">${tags}</div>` : ""}<p>${esc(c.sentence)}</p>${wiki}${newsLine(c.news)}`;
}
async function renderHistory(){
  if (!OTD) { try { OTD = await (await fetch("onthisday.json", {cache: "no-store"})).json(); } catch(e){ OTD = {items: []}; } }
  if (tab !== "history") return;
  const items = OTD.items || [];
  if (!items.length) { $("#view").innerHTML = `<p class="empty">Nothing for today yet. Run <code>python -m nepalradar onthisday</code>.</p>`; return; }
  const top = items.slice().sort((a, b) => (b.score || 0) - (a.score || 0))[0];
  const rest = items.filter(c => c !== top);
  const [y0, y1] = OTD.years_checked || [];
  $("#view").innerHTML = `<div style="padding:22px 0 60px">
    <div class="otd-head"><h2>${esc(OTD.label)} in Nepal's history</h2>
      <span class="count">${items.length} years with something on this date, ${y0}–${y1}</span></div>
    ${kantipurBox(OTD.kantipur)}
    <div class="feature"><div class="yr">${top.year}</div>${otdItem(top)}</div>
    <div class="timeline">${rest.map(c => `<div class="yrow"><div class="y">${c.year}</div><div>${otdItem(c)}</div></div>`).join("")}</div>
    <p class="count" style="margin-top:18px">Incidents come from English Wikipedia, its articles and its daily news pages: the best-known
      one per year, by how many language editions cover it. The news piece is a report dated that day (or up to three days later):
      cited by Wikipedia, from nepalnews.com's 2001-2004 pages saved by the Wayback Machine, from the Nepali sites' archives (2013 on)
      or from that week's Nepali Times (2000 on). Years with nothing on Wikipedia show nepalnews.com's lead story that day (2001-2004),
      the story most Nepali outlets ran (2014 on) or the Nepali Times headline of that week.</p>
  </div>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#savedN").textContent = Object.keys(SAVED).length ? `(${Object.keys(SAVED).length})` : "";
  ({today: renderToday, history: renderHistory, archive: renderArchive, saved: renderSaved, sources: renderSources})[tab]();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t){ tab = t.dataset.tab; render(); return; }
  const p = e.target.closest("[data-topic]"); if (p){ topic = p.dataset.topic; render(); return; }
  const s = e.target.closest("[data-status]"); if (s){ status = s.dataset.status; render(); return; }
  const o = e.target.closest("[data-outlet]"); if (o){ ARCH.outlet = ARCH.outlet === o.dataset.outlet ? "" : o.dataset.outlet; renderArchive(); return; }
  const v = e.target.closest("[data-save]");
  if (v){
    const id = v.dataset.save;
    if (SAVED[id]) delete SAVED[id];
    else { const st = DATA.stories.find(x => x.id === id) || SAVED[id]; if (st) SAVED[id] = st; }
    storeSaved(SAVED); render();
  }
});

fetch("news.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  DATA = d;
  const f = d.funnel;
  $("#sub").textContent = `Updated ${new Date(d.generated_at).toLocaleString()}. The Nepal stories that the most outlets are covering, from ${d.sources.reduce((n, s) => n + (s.name === "feeds" ? (parseInt(s.detail) || 0) : 0), 0)} Nepali and international news feeds and the world's press (GDELT), plus an archive of past news.`;
  $("#stats").innerHTML = `<div class="stat"><b>${f.shown}</b><span>stories shown</span></div>
    <div class="stat"><b>${d.new_today}</b><span>new today</span></div>
    <div class="stat"><b>${d.stories.filter(s => s.status === "rising").length}</b><span>rising</span></div>
    <div class="stat"><b>${f.articles_in_window.toLocaleString()}</b><span>articles read</span></div>`;
  $("#foot").innerHTML = `Every story links to the outlets' own articles. Briefs are written in English from headlines and snippets and can be wrong; read the source before you publish. <a href="progress.html">How this was built</a> · <a href="https://github.com/girimohan/nepal-news-radar">Code</a>`;
  render();
}).catch(() => { $("#view").innerHTML = `<p class="empty">No data yet. Run the workflow once (Actions → Nepal news radar → Run workflow).</p>`; });
</script>
</body>
</html>
